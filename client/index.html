<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Apply system dark/light theme before first paint to avoid flash -->
  <script>
    (function () {
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (prefersDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="/produs-logo.png" />
  <link rel="apple-touch-icon" href="/produs-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Produs" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Produs - The Minimalist Productivity Tool" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <title>Produs</title>
</head>

<body>
  <div id="initial-loader" class="initial-loader">
    <div class="loader-content">
      <div class="loader-logo">
        <div class="logo-inner"></div>
      </div>
      <h1 class="loader-title">Produs</h1>
      <div class="loader-line"></div>
      <span class="loader-text">INITIALIZING SYSTEM</span>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <style>
    .initial-loader {
      fixed: inset 0;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.8s ease-in-out, visibility 0.8s;
    }

    /* Support light mode if OS prefers */
    @media (prefers-color-scheme: light) {
      .initial-loader {
        background: #f8f8f8;
      }
      .logo-inner {
        background: #fff !important;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.1) !important;
      }
      .loader-logo {
        background: #000 !important;
        box-shadow: 0 0 40px rgba(0,0,0,0.2) !important;
        border-color: rgba(0,0,0,0.4) !important;
      }
      .loader-title, .loader-text {
        color: #000 !important;
      }
      .loader-line {
        background: linear-gradient(to right, transparent, rgba(0,0,0,0.6), transparent) !important;
      }
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .loader-logo {
      width: 80px;
      height: 80px;
      background: #fff;
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 0 40px rgba(255,255,255,0.8);
      position: relative;
    }

    .loader-logo::before {
      content: '';
      position: absolute;
      inset: -10px;
      background: rgba(0, 102, 255, 0.2);
      filter: blur(20px);
      border-radius: 50%;
      transform: translateY(10px) rotate(-45deg);
    }

    .logo-inner {
      width: 40px;
      height: 40px;
      background: #000;
      transform: rotate(-45deg);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.5);
    }

    .loader-title {
      font-family: "Inter", "Manrope", sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.8em;
      text-transform: uppercase;
      color: #fff;
      margin-left: 0.8em;
    }

    .loader-line {
      width: 128px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent);
    }

    .loader-text {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0.3; }
    }

    .initial-loader.fade-out {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</body>

</html>

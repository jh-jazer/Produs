<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/png" href="/produs-logo.png" />
  <link rel="apple-touch-icon" href="/produs-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Produs" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Produs - The Minimalist Productivity Tool" />
  <style>
    /* Instant Blackout: Run before anything else to prevent white flashes */
    html, body {
      background: #000000 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <title>Produs</title>
</head>

<body>
  <div id="initial-loader" class="initial-loader">
    <!-- HUD Layer -->
    <div class="hud-layer">
      <div class="hud-top-left">
        SYS_INIT_SEQUENCE // P.001A<br />
        MEMORY_ALLOC // OK<br />
        GRAPH_ENGINE // ACTIVE
      </div>
      <div class="hud-bottom-right" id="hud-stats">
        COORDINATES: 0, 0<br />
        LATENCY: 14MS<br />
        STATUS: CALIBRATING
      </div>
    </div>

    <!-- Scanner Effect -->
    <div class="scanline"></div>

    <div class="loader-content">
      <!-- 3D Coin Container -->
      <div class="coin-wrapper">
        <div class="coin-glow"></div>
        <div class="coin" id="coin-3d">
          <div class="face front">
            <img src="/produs-logo.png" alt="Produs" />
          </div>
          <div id="coin-extrusion"></div>
          <div class="face back">
            <img src="/produs-logo.png" alt="Produs" />
          </div>
        </div>
      </div>

      <div class="loader-text-container">
        <h1 class="loader-title">Produs</h1>
        <div class="loader-line"></div>
        <span class="loader-status" id="loader-status">INITIALIZING SYSTEM</span>
        <div class="progress-info">
          <span class="progress-percent" id="progress-percent">0%</span>
        </div>
      </div>
    </div>

    <div class="loader-progress-container">
      <div class="loader-progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <style>
    :root {
      --electric-blue: #0066FF;
      --cyan: #06b6d4;
    }

    .initial-loader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
      overflow: hidden;
      font-family: "Manrope", sans-serif;
    }

    /* HUD Decorations */
    .hud-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .hud-top-left {
      position: absolute;
      top: 40px;
      left: 40px;
      font-family: monospace;
      font-size: 8px;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 1px;
      line-height: 1.5;
    }

    .hud-bottom-right {
      position: absolute;
      bottom: 40px;
      right: 40px;
      font-family: monospace;
      font-size: 8px;
      color: rgba(255, 255, 255, 0.2);
      text-align: right;
      letter-spacing: 1px;
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      .hud-layer { display: none; }
    }

    /* Scanline Effect */
    .scanline {
      position: absolute;
      inset: 0;
      height: 40vh;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.04), transparent);
      pointer-events: none;
      z-index: 5;
      animation: scanline 8s linear infinite;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(200%); }
    }

    /* 3D Coin Animation */
    .coin-wrapper {
      position: relative;
      perspective: 1000px;
      margin-bottom: 3rem;
    }

    .coin-glow {
      position: absolute;
      inset: -50px;
      background: var(--electric-blue);
      filter: blur(40px);
      border-radius: 50%;
      opacity: 0.15;
      animation: glowPulse 3s infinite ease-in-out;
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.15; }
      50% { transform: scale(1.2); opacity: 0.25; }
    }

    .coin {
      width: 120px;
      height: 120px;
      position: relative;
      transform-style: preserve-3d;
      animation: coinRotate 4s linear infinite, coinFloat 2s infinite ease-in-out;
    }

    @keyframes coinRotate {
      0% { transform: rotateY(0deg) rotateX(-15deg); }
      100% { transform: rotateY(360deg) rotateX(-15deg); }
    }

    @keyframes coinFloat {
      0%, 100% { margin-top: 0; }
      50% { margin-top: -15px; }
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(to bottom, #1e293b, #0f172a);
      border: 3px solid var(--cyan);
      box-shadow: inset 0 0 20px rgba(6, 182, 212, 0.5), 0 0 15px var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .face img {
      width: 70%;
      height: 70%;
      object-fit: contain;
      z-index: 2;
    }

    .face::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(6, 182, 212, 0.2);
      filter: blur(8px);
    }

    .front { transform: translateZ(5px); }
    .back { transform: translateZ(-5px) rotateY(180deg); }

    .extrusion-layer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #083344;
      border: 2px solid #020617;
    }

    /* Loader Content styling */
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .loader-text-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .loader-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.8em;
      text-transform: uppercase;
      color: #fff;
      margin-left: 0.8em;
    }

    .loader-line {
      width: 200px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.5), transparent);
    }

    .loader-status {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      animation: textPulse 2s infinite;
    }

    @keyframes textPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .progress-info {
      margin-top: 1rem;
    }

    .progress-percent {
      font-family: monospace;
      font-size: 10px;
      color: var(--electric-blue);
      letter-spacing: 0.2em;
    }

    /* Progress Bar */
    .loader-progress-container {
      position: absolute;
      bottom: 80px;
      width: 256px;
      height: 1px;
      background: rgba(255, 255, 255, 0.05);
      overflow: hidden;
    }

    .loader-progress-bar {
      height: 100%;
      width: 0%;
      background: #fff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 1);
    }

    .initial-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>

  <script>
    (function() {
      // Inject extrusion layers for 3D coin
      const extrusion = document.getElementById('coin-extrusion');
      for (let i = 0; i < 20; i++) {
        const layer = document.createElement('div');
        layer.className = 'extrusion-layer';
        layer.style.transform = `translateZ(${4 - i * 0.5}px)`;
        extrusion.appendChild(layer);
      }

      // Check if we should skip the loader (e.g. for deep links to pages with their own loaders)
      if (window.location.pathname.includes('/neural-sync')) {
        document.getElementById('initial-loader').style.display = 'none';
        return;
      }

      const progressBar = document.getElementById('progress-bar');
      const progressPercent = document.getElementById('progress-percent');
      const loaderStatus = document.getElementById('loader-status');
      const stats = document.getElementById('hud-stats');
      
      let progress = 0;
      let isAppReady = false;
      let isAnimationComplete = false;

      const labels = [
        { threshold: 0, text: 'INITIALIZING LOGIC' },
        { threshold: 30, text: 'CALIBRATING MATRIX' },
        { threshold: 60, text: 'OPTIMIZING INTERFACE' },
        { threshold: 95, text: 'SYSTEM READY' }
      ];

      function updateLoader() {
        if (progress >= 100) {
          progress = 100;
          isAnimationComplete = true;
          checkAndHide();
          return;
        }

        const step = progress < 30 ? 1.5 : progress < 70 ? 0.8 : 0.4;
        progress = Math.min(100, progress + step);

        progressBar.style.width = progress + '%';
        progressPercent.textContent = Math.floor(progress) + '%';

        // Update Text
        const currentLabel = labels.filter(l => progress >= l.threshold).pop();
        if (currentLabel && loaderStatus.textContent !== currentLabel.text) {
          loaderStatus.textContent = currentLabel.text;
        }

        // Update HUD Stats
        if (stats) {
          stats.innerHTML = `COORDINATES: ${Math.floor(progress * 7.2)}, ${Math.floor(progress * 13.4)}<br />LATENCY: 14MS<br />STATUS: ${progress < 100 ? 'CALIBRATING' : 'READY'}`;
        }

        requestAnimationFrame(updateLoader);
      }

      function checkAndHide() {
        if (isAnimationComplete && isAppReady) {
          const loader = document.getElementById('initial-loader');
          if (!loader) return;
          
          setTimeout(() => {
            if (!loader) return;
            loader.classList.add('fade-out');
            setTimeout(() => {
              if (loader.parentNode) loader.remove();
            }, 1200);
          }, 800);
        }
      }

      window.hideInitialLoader = () => {
        isAppReady = true;
        checkAndHide();
      };

      // Failsafe: Ensure loader disappears after 6 seconds even if app fails to signal
      setTimeout(() => {
        if (!isAppReady) {
          console.warn('Initial loader timed out. Forcing fade-out.');
          isAppReady = true;
          checkAndHide();
        }
      }, 6000);

      // Start the animation
      requestAnimationFrame(updateLoader);
    })();
  </script>

</body>

</html>

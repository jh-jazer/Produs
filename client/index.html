<!doctype html>
<html lang="en" class="loading-lock">

<head>
  <!-- Anti-flash theme bootstrap: runs synchronously before first paint -->
  <script>
    (function () {
      var stored = localStorage.getItem('produs-theme-mode');
      var resolved = stored === 'dark'
        ? 'dark'
        : stored === 'light'
          ? 'light'
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (resolved === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/png" href="/produs-logo.png" />
  <link rel="apple-touch-icon" href="/produs-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Produs" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Produs - The Minimalist Productivity Tool" />
  <style>
    /* Instant Blackout */
    .loading-lock {
      background: #000000 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden !important;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <title>Produs</title>
</head>

<body>
  <div id="initial-loader" class="initial-loader">
    <div class="cinematic-container">
      <!-- Tip Display Section -->
      <div class="tip-wrapper">
        <div class="tip-header">PRODUS</div>
        <div class="tip-content" id="tip-content">"Preparing your workspace..."</div>
      </div>

      <!-- Minimalist Loading Info -->
      <div class="loader-info">
        <div class="loading-bar-container">
          <div class="loading-bar-fill" id="progress-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <style>
    :root {
      --brand-primary: #ffffff;
      --brand-glow: rgba(255, 255, 255, 0.2);
    }

    .initial-loader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.5s;
      overflow: hidden;
      font-family: "Manrope", sans-serif;
    }

    .cinematic-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

    /* Tip Styling */
    .tip-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      min-height: 60px;
    }

    .tip-header {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8em;
      color: rgba(255, 255, 255, 0.3);
      text-transform: uppercase;
      animation: fadeIn 1s ease-out forwards;
    }

    .tip-content {
      font-size: 10px;
      font-weight: 800;
      line-height: 1.8;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #fff;
      max-width: 500px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .tip-content.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Loading Info Styling */
    .loader-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 250px;
      gap: 1rem;
    }

    .loading-bar-container {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .loading-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: #fff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
      transition: width 0.4s linear;
    }

    .loading-status {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .initial-loader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
  </style>

  <script>
    (function() {
      let tips = [
        "\"The Rule of Three: Define 3 core tasks each morning. Focus only on them.\"",
        "\"Deep Work: 90 minutes of uninterrupted focus beats 4 hours of distracted work.\"",
        "\"Analog Mornings: Avoid screens for the first 30 minutes after waking up.\"",
        "\"The Shutdown Ritual: Clear your task list before 6 PM to reclaim your evening.\""
      ];

      // Fetch external tips if available
      fetch('/tips.json')
        .then(res => res.json())
        .then(data => {
          const allTips = Object.values(data).flat();
          if (allTips.length > 0) tips = allTips;
        })
        .catch(() => console.log('Using local fallback tips'));

      // Check if we should skip the loader entirely
      if (window.location.pathname.includes('/neural-sync')) {
        const loader = document.getElementById('initial-loader');
        if (loader) loader.style.display = 'none';
        return;
      }

      // --- Repeat-visit fast path ---
      var isReturningUser = false;
      try { isReturningUser = localStorage.getItem('produs-has-loaded') === '1'; } catch(e) {}

      var progressBar = document.getElementById('progress-bar');
      var tipContent = document.getElementById('tip-content');

      var progress = 0;
      var isAppReady = false;
      var exitStarted = false;

      function setNewTip() {
        var randomTip = tips[Math.floor(Math.random() * tips.length)];
        tipContent.classList.remove('active');
        setTimeout(function() {
          tipContent.textContent = randomTip;
          tipContent.classList.add('active');
        }, 300);
      }

      setNewTip();
      // Only rotate tips for first-time visitors (returning users won't see many)
      var tipInterval = isReturningUser ? null : setInterval(setNewTip, 5000);

      // --- Core exit routine ---
      function beginExit() {
        if (exitStarted) return;
        exitStarted = true;

        // Mark the user as a returning visitor for next time
        try { localStorage.setItem('produs-has-loaded', '1'); } catch(e) {}

        if (tipInterval) clearInterval(tipInterval);

        // Fast-forward progress bar to 100% visually
        progress = 100;
        if (progressBar) {
          progressBar.style.transition = 'width 0.3s ease-out';
          progressBar.style.width = '100%';
        }

        // Brief pause at 100% so the user sees completion, then fade out
        var exitDelay = isReturningUser ? 200 : 400;
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (!loader) return;
          loader.classList.add('fade-out');
          document.documentElement.classList.remove('loading-lock');
          setTimeout(function() {
            if (loader.parentNode) loader.remove();
          }, 1500);
        }, exitDelay);
      }

      // --- Progress animation ---
      // Returning users: aggressive speed (~2s to fill).
      // First-time users: cinematic speed (~5s to fill), but exits early if React is ready.
      function updateProgress() {
        if (exitStarted) return;

        // If React is already ready, fast-forward immediately
        if (isAppReady) {
          beginExit();
          return;
        }

        if (progress >= 100) {
          // Bar is full but React isn't ready yet — just wait
          return;
        }

        var step;
        if (isReturningUser) {
          // Fast path: fill in ~2s (120 frames at 60fps, need 100% total)
          step = progress < 60 ? 1.5 : progress < 90 ? 1.0 : 0.5;
        } else {
          // Cinematic path: fill in ~5s
          step = progress < 40 ? 0.6 : progress < 80 ? 0.3 : 0.15;
        }
        progress = Math.min(100, progress + step);

        if (progressBar) progressBar.style.width = progress + '%';

        requestAnimationFrame(updateProgress);
      }

      // --- Public API: React calls this when mounted ---
      window.hideInitialLoader = function() {
        isAppReady = true;
        beginExit();
      };

      // --- Failsafe: never strand the user (reduced from 12s to 6s) ---
      setTimeout(function() {
        if (!exitStarted) {
          isAppReady = true;
          beginExit();
        }
      }, 6000);

      requestAnimationFrame(updateProgress);
    })();
  </script>
</body>

</html>
